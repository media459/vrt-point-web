<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VRT Point</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="title">
      <div class="brand">VIETNAM ROLLER</div>
      <h1 id="title">VRT POINT</h1>
      <p class="subtitle">Tra cứu điểm thành viên</p>
      <form id="lookup-form" novalidate>
        <label for="member-id">Mã thành viên</label>
        <input id="member-id" name="memberId" autocomplete="off" placeholder="VRT000001" required pattern="VRT[0-9]{6}" />
        <label for="phone-last4">4 số cuối số điện thoại</label>
        <input id="phone-last4" name="phoneLast4" inputmode="numeric" autocomplete="off" placeholder="0001" required pattern="[0-9]{4}" maxlength="4" />
        <button type="submit">TRA CỨU</button>
      </form>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <section id="result" class="result" hidden></section>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
